<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrueCheck Barcode Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #087f5b;
        }

        #reader {
            width: 100%;
            margin: 20px auto;
        }

        input, button {
            padding: 12px;
            margin: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            width: 100%;
        }

        button {
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .note {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>TrueCheck Barcode Scanner</h1>

    <p>Scan a product barcode using your camera.</p>

    <div id="reader"></div>

    <h3>Or enter the barcode manually</h3>

    <form action="/barcode" method="GET">
        <input
            type="text"
            name="code"
            placeholder="Enter product barcode"
            required
        >
        <button type="submit">Verify Product</button>
    </form>

    <p id="message" class="note">
        Allow camera access when your browser asks.
    </p>

    <script>
        const message = document.getElementById("message");

        if (typeof Html5QrcodeScanner !== "undefined") {
            const scanner = new Html5QrcodeScanner(
                "reader",
                {
                    fps: 10,
                    qrbox: { width: 250, height: 150 },
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.QR_CODE
                    ]
                },
                false
            );

            scanner.render(function(decodedText) {
                message.textContent = "Barcode detected: " + decodedText;
                window.location.href =
                    "/barcode?code=" + encodeURIComponent(decodedText);
            }, function(error) {
                // Ignore temporary scanning errors.
            });
        } else {
            message.textContent =
                "Camera scanner could not load. You can enter the barcode manually.";
        }
    </script>

</body>
</html>
